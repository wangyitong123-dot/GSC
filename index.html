<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GSC Knowledge Taxonomy</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050711;
      --panel: rgba(10, 17, 36, 0.78);
      --panel-strong: rgba(16, 27, 56, 0.88);
      --line: rgba(160, 184, 255, 0.22);
      --line-strong: rgba(126, 231, 255, 0.42);
      --text: #f5f7ff;
      --muted: #b9c2d8;
      --soft: #8794b2;
      --cyan: #7ee7ff;
      --gold: #ffd36a;
      --coral: #ff8a7a;
      --green: #8ff0b2;
      --violet: #bda7ff;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.34);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
      letter-spacing: 0;
    }

    body {
      overflow-x: hidden;
    }

    #starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background:
        radial-gradient(circle at 18% 16%, rgba(126, 231, 255, 0.18), transparent 28rem),
        radial-gradient(circle at 86% 12%, rgba(255, 211, 106, 0.12), transparent 24rem),
        linear-gradient(135deg, #04050d 0%, #0b1328 44%, #130d22 100%);
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 22px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      margin: 0 auto 16px;
      max-width: 1480px;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.1;
      font-weight: 760;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(82px, 1fr));
      gap: 10px;
      min-width: 520px;
    }

    .metric {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.055);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
    }

    .metric strong {
      display: block;
      font-size: 22px;
      line-height: 1;
    }

    .metric span {
      display: block;
      margin-top: 6px;
      color: var(--soft);
      font-size: 12px;
    }

    .metric.coverage strong {
      color: var(--gold);
      text-shadow: 0 0 20px rgba(255, 211, 106, 0.42);
    }

    .toolbar {
      max-width: 1480px;
      margin: 0 auto 16px;
      display: grid;
      grid-template-columns: minmax(240px, 1fr) auto auto auto;
      gap: 10px;
      align-items: center;
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 14px 0 38px;
      background: rgba(9, 15, 32, 0.76);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .search input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(126, 231, 255, 0.16);
    }

    .search::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 50%;
      width: 12px;
      height: 12px;
      border: 2px solid var(--cyan);
      border-radius: 50%;
      transform: translateY(-54%);
      opacity: 0.82;
    }

    .search::after {
      content: "";
      position: absolute;
      left: 26px;
      top: 27px;
      width: 8px;
      height: 2px;
      background: var(--cyan);
      transform: rotate(45deg);
      opacity: 0.82;
    }

    .toolbar button,
    .tree-button,
    .chip,
    .star-link {
      border: 1px solid var(--line);
      color: var(--text);
      background: rgba(255, 255, 255, 0.065);
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
    }

    .toolbar button {
      height: 42px;
      padding: 0 13px;
      color: var(--muted);
      white-space: nowrap;
    }

    .toolbar button:hover,
    .tree-button:hover,
    .chip:hover,
    .star-link:hover {
      border-color: var(--line-strong);
      background: rgba(126, 231, 255, 0.11);
    }

    .layout {
      max-width: 1480px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 390px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .surface {
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      border-radius: 8px;
    }

    .tree-panel {
      position: sticky;
      top: 18px;
      max-height: calc(100vh - 36px);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .panel-head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 740;
    }

    .panel-head p {
      margin: 6px 0 0;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.5;
    }

    .tree {
      overflow: auto;
      padding: 10px 10px 14px;
    }

    .tree-group {
      margin: 2px 0;
    }

    .tree-children {
      margin-left: 16px;
      padding-left: 9px;
      border-left: 1px solid rgba(126, 231, 255, 0.18);
    }

    .tree-button {
      width: 100%;
      min-height: 34px;
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      text-align: left;
      color: var(--muted);
      background: transparent;
    }

    .tree-button.is-selected {
      color: var(--text);
      border-color: rgba(255, 211, 106, 0.72);
      background: rgba(255, 211, 106, 0.12);
    }

    .tree-button.is-covered {
      border-color: rgba(255, 211, 106, 0.42);
      box-shadow: inset 0 0 18px rgba(255, 211, 106, 0.08), 0 0 18px rgba(255, 211, 106, 0.1);
    }

    .tree-button.is-covered .marker {
      background: var(--gold);
      box-shadow: 0 0 18px var(--gold), 0 0 32px rgba(255, 211, 106, 0.35);
    }

    .tree-button .marker {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 14px var(--cyan);
      justify-self: center;
    }

    .tree-button.depth-0 .marker {
      background: var(--gold);
      box-shadow: 0 0 18px var(--gold);
    }

    .tree-button.depth-1 .marker {
      background: var(--cyan);
      box-shadow: 0 0 16px var(--cyan);
    }

    .tree-button.depth-2 .marker {
      background: var(--green);
      box-shadow: 0 0 14px var(--green);
    }

    .tree-button.depth-3 .marker {
      background: var(--violet);
      box-shadow: 0 0 13px var(--violet);
    }

    .tree-label {
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.25;
    }

    .tree-count {
      color: var(--soft);
      font-size: 11px;
      white-space: nowrap;
    }

    .content-panel {
      min-height: calc(100vh - 136px);
      padding: 18px;
    }

    .hero-strip {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: start;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--cyan);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .hero-strip h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.18;
      overflow-wrap: anywhere;
    }

    .hero-strip p {
      margin: 9px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 14px;
    }

    .path {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      max-width: 430px;
    }

    .chip {
      min-height: 30px;
      padding: 6px 10px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .chip.is-current {
      color: #11131d;
      border-color: transparent;
      background: var(--gold);
    }

    .constellation {
      position: relative;
      margin: 18px 0;
      padding: 16px;
      border: 1px solid rgba(126, 231, 255, 0.18);
      border-radius: 8px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.02)),
        repeating-linear-gradient(115deg, transparent 0 24px, rgba(126, 231, 255, 0.035) 24px 25px);
    }

    .constellation h3,
    .section-title {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--text);
    }

    .star-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
    }

    .star-link {
      position: relative;
      min-height: 54px;
      display: grid;
      grid-template-columns: 14px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      text-align: left;
      color: var(--muted);
    }

    .star-link::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 16px rgba(126, 231, 255, 0.9);
    }

    .star-link strong {
      display: block;
      min-width: 0;
      color: var(--text);
      font-size: 13px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .star-link span {
      display: block;
      margin-top: 4px;
      color: var(--soft);
      font-size: 11px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .summary-tile {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 13px 14px;
      background: rgba(255, 255, 255, 0.055);
    }

    .summary-tile strong {
      display: block;
      font-size: 20px;
      line-height: 1;
    }

    .summary-tile span {
      display: block;
      margin-top: 7px;
      color: var(--soft);
      font-size: 12px;
    }

    .summary-tile.coverage {
      border-color: rgba(255, 211, 106, 0.38);
      background: rgba(255, 211, 106, 0.09);
      box-shadow: inset 0 0 22px rgba(255, 211, 106, 0.08);
    }

    .summary-tile.coverage strong {
      color: var(--gold);
    }

    .knowledge-graph {
      position: relative;
      margin: 18px 0;
      border: 1px solid rgba(126, 231, 255, 0.24);
      border-radius: 8px;
      background:
        radial-gradient(circle at 72% 22%, rgba(255, 72, 217, 0.16), transparent 17rem),
        radial-gradient(circle at 26% 70%, rgba(53, 255, 224, 0.18), transparent 20rem),
        linear-gradient(180deg, rgba(3, 6, 14, 0.96), rgba(6, 11, 24, 0.92));
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.035), 0 30px 90px rgba(0, 0, 0, 0.3);
    }

    .kg-head {
      position: absolute;
      left: 22px;
      top: 18px;
      z-index: 4;
      pointer-events: none;
    }

    .kg-head h3 {
      margin: 0;
      font-size: 26px;
      line-height: 1.04;
      font-weight: 680;
      color: rgba(255, 255, 255, 0.94);
      text-shadow: 0 0 22px rgba(126, 231, 255, 0.22);
    }

    .kg-head p {
      margin: 8px 0 0;
      color: rgba(185, 194, 216, 0.82);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .kg-stage {
      position: relative;
      min-height: 560px;
      height: min(70vh, 700px);
      overflow: hidden;
      background:
        linear-gradient(90deg, transparent 0 49.8%, rgba(126, 231, 255, 0.16) 50%, transparent 50.2%),
        linear-gradient(0deg, transparent 0 49.8%, rgba(189, 167, 255, 0.12) 50%, transparent 50.2%);
    }

    .kg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .kg-grid {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(rgba(126, 231, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(126, 231, 255, 0.045) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle at 50% 52%, black, transparent 72%);
      opacity: 0.38;
    }

    .kg-node {
      position: absolute;
      left: var(--x);
      top: var(--y);
      z-index: 3;
      display: grid;
      grid-template-columns: 22px minmax(0, auto);
      gap: 8px;
      align-items: center;
      max-width: 205px;
      min-height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      padding: 7px 11px 7px 8px;
      background: rgba(3, 7, 18, 0.58);
      color: var(--text);
      transform: translate(-50%, -50%);
      cursor: pointer;
      font: inherit;
      text-align: left;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--node-color) 38%, transparent), 0 0 28px color-mix(in srgb, var(--node-color) 28%, transparent);
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .kg-node:hover {
      transform: translate(-50%, -50%) scale(1.05);
      border-color: color-mix(in srgb, var(--node-color) 76%, white);
      background: rgba(9, 18, 38, 0.78);
    }

    .kg-node.core {
      grid-template-columns: 38px minmax(0, auto);
      min-height: 68px;
      max-width: 280px;
      padding: 12px 18px 12px 13px;
      border-radius: 999px;
      background: rgba(10, 12, 24, 0.88);
      box-shadow: 0 0 0 1px rgba(255, 211, 106, 0.72), 0 0 46px rgba(255, 211, 106, 0.34);
    }

    .kg-node-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--node-color);
      box-shadow: 0 0 18px var(--node-color), 0 0 34px color-mix(in srgb, var(--node-color) 62%, transparent);
    }

    .kg-node.core .kg-node-dot {
      width: 34px;
      height: 34px;
      background: radial-gradient(circle at 30% 30%, #fff6cf, var(--gold) 42%, #ff7b54);
      box-shadow: 0 0 30px rgba(255, 211, 106, 0.9), 0 0 70px rgba(255, 138, 122, 0.34);
    }

    .kg-node strong {
      display: block;
      min-width: 0;
      color: rgba(255, 255, 255, 0.96);
      font-size: 13px;
      line-height: 1.18;
      overflow-wrap: anywhere;
      text-shadow: 0 0 14px color-mix(in srgb, var(--node-color) 34%, transparent);
    }

    .kg-node.core strong {
      font-size: 20px;
    }

    .kg-node span {
      display: block;
      margin-top: 4px;
      color: rgba(199, 209, 232, 0.74);
      font-size: 10.5px;
      line-height: 1.22;
      white-space: nowrap;
    }

    .kg-node.core span {
      white-space: normal;
      font-size: 11.5px;
    }

    .kg-node.is-covered {
      border-color: rgba(255, 211, 106, 0.68);
      background:
        radial-gradient(circle at 22% 50%, rgba(255, 211, 106, calc(0.13 + var(--coverage-ratio) * 0.2)), transparent 4.2rem),
        rgba(8, 10, 22, 0.76);
      box-shadow:
        0 0 0 1px rgba(255, 211, 106, 0.58),
        0 0 calc(24px + var(--coverage-ratio) * 32px) rgba(255, 211, 106, 0.38),
        0 0 42px color-mix(in srgb, var(--node-color) 22%, transparent);
    }

    .kg-node.is-covered .kg-node-dot {
      background: radial-gradient(circle at 30% 30%, #fff8d6, var(--gold) 50%, #ff8058);
      box-shadow: 0 0 22px rgba(255, 211, 106, 0.96), 0 0 46px rgba(255, 211, 106, 0.34);
    }

    .coverage-badge {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      min-height: 21px;
      margin-top: 6px;
      border: 1px solid rgba(255, 211, 106, 0.44);
      border-radius: 999px;
      padding: 3px 8px;
      color: #ffe9a3;
      background: rgba(255, 211, 106, 0.11);
      font-size: 10.5px;
      font-style: normal;
      line-height: 1;
      box-shadow: 0 0 18px rgba(255, 211, 106, 0.12);
    }

    .kg-legend {
      position: absolute;
      right: 18px;
      bottom: 16px;
      z-index: 4;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      max-width: 520px;
      pointer-events: none;
    }

    .kg-legend span {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      padding: 6px 9px;
      background: rgba(3, 7, 18, 0.58);
      color: rgba(199, 209, 232, 0.82);
      font-size: 11px;
      backdrop-filter: blur(8px);
    }

    .mindmap {
      position: relative;
      margin: 18px 0;
      padding: 16px;
      border: 1px solid rgba(126, 231, 255, 0.2);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 50%, rgba(126, 231, 255, 0.12), transparent 19rem),
        linear-gradient(rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0.02));
      overflow: hidden;
    }

    .mindmap h3 {
      margin: 0 0 12px;
      font-size: 14px;
      color: var(--text);
    }

    .mindmap-board {
      position: relative;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(180px, 230px) minmax(220px, 1fr);
      gap: 30px;
      align-items: center;
      min-height: 360px;
      max-height: 620px;
      overflow: auto;
      padding: 16px 4px;
    }

    .mindmap-board::before {
      content: "";
      position: absolute;
      left: 12%;
      right: 12%;
      top: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(126, 231, 255, 0.44), transparent);
      opacity: 0.7;
      pointer-events: none;
    }

    .mindmap-core {
      position: relative;
      z-index: 2;
      grid-column: 2;
      grid-row: 1;
      align-self: center;
      justify-self: stretch;
      border: 1px solid rgba(255, 211, 106, 0.78);
      border-radius: 8px;
      padding: 18px 16px;
      background:
        radial-gradient(circle at 22% 18%, rgba(255, 211, 106, 0.32), transparent 4rem),
        rgba(16, 23, 45, 0.94);
      box-shadow: 0 0 34px rgba(255, 211, 106, 0.24);
      text-align: center;
      color: var(--text);
    }

    .mindmap-core strong {
      display: block;
      font-size: 19px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .mindmap-core span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .mindmap-column {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 10px;
      align-content: center;
    }

    .mindmap-column.left {
      grid-column: 1;
    }

    .mindmap-column.right {
      grid-column: 3;
    }

    .mindmap-node {
      position: relative;
      min-height: 54px;
      width: 100%;
      border: 1px solid rgba(126, 231, 255, 0.24);
      border-radius: 8px;
      padding: 10px 12px;
      background: rgba(7, 13, 31, 0.82);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font: inherit;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }

    .mindmap-node::before {
      content: "";
      position: absolute;
      top: 50%;
      width: 30px;
      height: 1px;
      background: rgba(126, 231, 255, 0.5);
    }

    .mindmap-column.left .mindmap-node::before {
      right: -30px;
    }

    .mindmap-column.right .mindmap-node::before {
      left: -30px;
    }

    .mindmap-node::after {
      content: "";
      position: absolute;
      top: calc(50% - 4px);
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 14px rgba(126, 231, 255, 0.86);
    }

    .mindmap-column.left .mindmap-node::after {
      right: -4px;
    }

    .mindmap-column.right .mindmap-node::after {
      left: -4px;
    }

    .mindmap-node:hover {
      border-color: rgba(255, 211, 106, 0.65);
      background: rgba(126, 231, 255, 0.13);
    }

    .mindmap-node strong {
      display: block;
      min-width: 0;
      font-size: 13px;
      line-height: 1.28;
      overflow-wrap: anywhere;
    }

    .mindmap-node span {
      display: block;
      margin-top: 5px;
      color: var(--soft);
      font-size: 11px;
      line-height: 1.35;
    }

    .mindmap-node.function::after {
      background: var(--cyan);
    }

    .mindmap-node.category::after {
      background: var(--green);
      box-shadow: 0 0 14px rgba(143, 240, 178, 0.78);
    }

    .mindmap-node.sub-category::after {
      background: var(--violet);
      box-shadow: 0 0 14px rgba(189, 167, 255, 0.78);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 12px;
    }

    .detail-card {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: var(--panel-strong);
      padding: 15px;
      min-width: 0;
    }

    .detail-card.is-covered {
      border-color: rgba(255, 211, 106, 0.5);
      background:
        radial-gradient(circle at 88% 10%, rgba(255, 211, 106, 0.16), transparent 8rem),
        var(--panel-strong);
      box-shadow: 0 0 28px rgba(255, 211, 106, 0.11);
    }

    .detail-card h3 {
      margin: 0;
      font-size: 16px;
      line-height: 1.28;
      overflow-wrap: anywhere;
    }

    .detail-card .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 10px;
    }

    .pill {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      border: 1px solid rgba(126, 231, 255, 0.24);
      border-radius: 999px;
      padding: 4px 9px;
      color: var(--muted);
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .pill.covered {
      border-color: rgba(255, 211, 106, 0.52);
      color: #ffe9a3;
      background: rgba(255, 211, 106, 0.1);
    }

    .fields {
      display: grid;
      gap: 11px;
      margin-top: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 4px;
      color: var(--soft);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .field div {
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .field.muted div {
      color: var(--muted);
    }

    .empty {
      color: var(--soft);
      border: 1px dashed rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 18px;
      line-height: 1.6;
    }

    .footer-note {
      margin-top: 18px;
      color: var(--soft);
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 1120px) {
      .topbar,
      .toolbar,
      .layout {
        grid-template-columns: 1fr;
      }

      .metrics {
        min-width: 0;
      }

      .toolbar {
        grid-template-columns: 1fr 1fr 1fr;
      }

      .search {
        grid-column: 1 / -1;
      }

      .tree-panel {
        position: static;
        max-height: 58vh;
      }

      .content-panel {
        min-height: auto;
      }
    }

    @media (max-width: 680px) {
      .page {
        padding: 14px;
      }

      .metrics,
      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .hero-strip {
        grid-template-columns: 1fr;
      }

      .path {
        justify-content: flex-start;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .kg-stage {
        min-height: 620px;
        height: 620px;
      }

      .kg-head h3 {
        font-size: 22px;
      }

      .kg-node {
        max-width: 170px;
      }

      .mindmap-board {
        grid-template-columns: 1fr;
        max-height: none;
      }

      .mindmap-board::before,
      .mindmap-node::before {
        display: none;
      }

      .mindmap-core,
      .mindmap-column.left,
      .mindmap-column.right {
        grid-column: 1;
      }

      .mindmap-column.right {
        grid-row: auto;
      }
    }
  </style>

  </script>
  <script>
    const payload = window.TAXONOMY_DATA;
    const rows = payload.rows;
    const state = {
      query: "",
      selectedId: "root",
      expanded: new Set(["root"]),
      nodes: new Map()
    };

    const fieldLabels = [
      ["function", "Function"],
      ["category", "Category"],
      ["subCategory", "Sub Category"],
      ["km", "KM"],
      ["description", "Description"],
      ["bizOwner", "Biz Owner"],
      ["kmFocal", "KM Focal"],
      ["status", "Status"],
      ["comments", "Comments"]
    ];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function keyPart(value) {
      return encodeURIComponent(value || "__blank__");
    }

    function displayValue(value) {
      return value && value.trim() ? value : "Not provided";
    }

    function nodeId(type, parts) {
      return [type, ...parts.map(keyPart)].join("|");
    }

    function groupByOrdered(inputRows, getter) {
      const groups = [];
      const index = new Map();
      for (const row of inputRows) {
        const label = getter(row) || "";
        const key = label || "__blank__";
        if (!index.has(key)) {
          const group = { label, rows: [] };
          index.set(key, group);
          groups.push(group);
        }
        index.get(key).rows.push(row);
      }
      return groups;
    }

    function uniqueCount(inputRows, getter) {
      const values = new Set();
      for (const row of inputRows) {
        const value = getter(row);
        if (value) values.add(value);
      }
      return values.size;
    }

    function isCovered(row) {
      return row && (row.covered === true || row.covered === "true");
    }

    function coverageStats(inputRows) {
      const totalKeys = new Set();
      const coveredKeys = new Set();
      for (const row of inputRows || []) {
        const key = row.coverageKey || row.id;
        totalKeys.add(key);
        if (isCovered(row)) coveredKeys.add(key);
      }
      const total = totalKeys.size;
      const covered = coveredKeys.size;
      return {
        total,
        covered,
        ratio: total ? covered / total : 0,
        hasCoverage: covered > 0,
        fullCoverage: total > 0 && covered === total
      };
    }

    function coverageLabel(stats) {
      return stats.hasCoverage ? `Covered ${stats.covered}/${stats.total}` : "Not covered";
    }

    function filterRows() {
      const query = state.query.trim().toLowerCase();
      if (!query) return rows;
      return rows.filter((row) => Object.values(row).some((value) => String(value).toLowerCase().includes(query)));
    }

    function getNode(id) {
      return state.nodes.get(id) || state.nodes.get("root");
    }

    function registerNode(node) {
      state.nodes.set(node.id, node);
      return node;
    }

    function renderTree() {
      state.nodes = new Map();
      const filtered = filterRows();
      const root = registerNode({
        id: "root",
        type: "root",
        label: "GSC",
        rows: filtered,
        parts: [],
        depth: 0
      });

      const html = renderTreeNode(root, () => {
        return groupByOrdered(filtered, (row) => row.function).map((functionGroup) => {
          const functionNode = registerNode({
            id: nodeId("function", [functionGroup.label]),
            type: "function",
            label: functionGroup.label,
            rows: functionGroup.rows,
            parts: [functionGroup.label],
            depth: 1
          });
          return renderTreeNode(functionNode, () => {
            return groupByOrdered(functionGroup.rows, (row) => row.category).map((categoryGroup) => {
              const categoryNode = registerNode({
                id: nodeId("category", [functionGroup.label, categoryGroup.label]),
                type: "category",
                label: categoryGroup.label,
                rows: categoryGroup.rows,
                parts: [functionGroup.label, categoryGroup.label],
                depth: 2
              });
              return renderTreeNode(categoryNode, () => {
                return groupByOrdered(categoryGroup.rows, (row) => row.subCategory).map((subGroup) => {
                  const subNode = registerNode({
                    id: nodeId("subCategory", [functionGroup.label, categoryGroup.label, subGroup.label]),
                    type: "subCategory",
                    label: subGroup.label,
                    rows: subGroup.rows,
                    parts: [functionGroup.label, categoryGroup.label, subGroup.label],
                    depth: 3
                  });
                  return renderTreeNode(subNode);
                }).join("");
              });
            }).join("");
          });
        }).join("");
      });

      document.getElementById("tree").innerHTML = html;
    }

    function renderTreeNode(node, childrenRenderer) {
      const hasChildren = typeof childrenRenderer === "function";
      const isExpanded = state.expanded.has(node.id);
      const selected = state.selectedId === node.id;
      const coverage = coverageStats(node.rows);
      const label = node.label || "Not provided";
      const childText = coverage.hasCoverage ? `${coverage.covered}/${coverage.total} covered` : (node.type === "subCategory" ? `${node.rows.length} records` : `${node.rows.length} items`);
      const sign = hasChildren ? (isExpanded ? "-" : "+") : "";
      return `
        <div class="tree-group">
          <button class="tree-button depth-${node.depth} ${selected ? "is-selected" : ""} ${coverage.hasCoverage ? "is-covered" : ""} ${coverage.fullCoverage ? "is-full-covered" : ""}"
            type="button"
            aria-expanded="${hasChildren ? String(isExpanded) : "false"}"
            data-node-id="${escapeHtml(node.id)}"
            data-action="${hasChildren ? "toggle-select" : "select"}">
            <span class="marker" aria-hidden="true">${sign}</span>
            <span class="tree-label">${escapeHtml(label)}</span>
            <span class="tree-count">${escapeHtml(childText)}</span>
          </button>
          ${hasChildren && isExpanded ? `<div class="tree-children">${childrenRenderer()}</div>` : ""}
        </div>
      `;
    }

    function breadcrumbs(node) {
      if (!node || node.id === "root") {
        return `<button class="chip is-current" type="button" data-action="select" data-node-id="root">GSC</button>`;
      }
      const crumbs = [
        { id: "root", label: "GSC" },
      ];
      if (node.parts[0]) crumbs.push({ id: nodeId("function", [node.parts[0]]), label: node.parts[0] });
      if (node.parts[1]) crumbs.push({ id: nodeId("category", [node.parts[0], node.parts[1]]), label: node.parts[1] });
      if (node.parts[2]) crumbs.push({ id: node.id, label: node.parts[2] });
      return crumbs.map((crumb, index) => `
        <button class="chip ${index === crumbs.length - 1 ? "is-current" : ""}" type="button" data-action="select" data-node-id="${escapeHtml(crumb.id)}">
          ${escapeHtml(crumb.label || "Not provided")}
        </button>
      `).join("");
    }

    function childNodes(node) {
      if (!node || node.type === "subCategory") return [];
      if (node.type === "root") {
        return groupByOrdered(node.rows, (row) => row.function).map((group) => ({
          id: nodeId("function", [group.label]),
          label: group.label,
          rows: group.rows,
          type: "Function"
        }));
      }
      if (node.type === "function") {
        return groupByOrdered(node.rows, (row) => row.category).map((group) => ({
          id: nodeId("category", [node.label, group.label]),
          label: group.label,
          rows: group.rows,
          type: "Category"
        }));
      }
      if (node.type === "category") {
        return groupByOrdered(node.rows, (row) => row.subCategory).map((group) => ({
          id: nodeId("subCategory", [node.parts[0], node.label, group.label]),
          label: group.label,
          rows: group.rows,
          type: "Sub Category"
        }));
      }
      return [];
    }

    const graphPalette = ["#35FFE0", "#FF48D9", "#FFD36A", "#7EE7FF", "#BDA7FF", "#FF6B5E", "#8FF0B2", "#F7A6FF"];

    function hashString(value) {
      let hash = 0;
      for (let index = 0; index < String(value).length; index += 1) {
        hash = (hash << 5) - hash + String(value).charCodeAt(index);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function graphNodeClass(type) {
      return type === "Sub Category" ? "sub-category" : type.toLowerCase();
    }

    function graphPoints(children, node) {
      const count = Math.max(children.length, 1);
      const radiusX = node.type === "root" ? 34 : 36;
      const radiusY = node.type === "root" ? 31 : 33;
      const startAngle = node.type === "root" ? -1.36 : -1.56;
      return children.map((child, index) => {
        const seed = hashString(`${child.id}-${index}`);
        const ring = index < 20 ? 1 : 0.72;
        const angle = startAngle + (index / count) * Math.PI * 2;
        const jitterX = ((seed % 17) - 8) * 0.36;
        const jitterY = (((seed >> 4) % 17) - 8) * 0.32;
        const color = graphPalette[(index + (node.depth || 0) * 2) % graphPalette.length];
        return {
          ...child,
          x: clamp(50 + Math.cos(angle) * radiusX * ring + jitterX, 12, 88),
          y: clamp(53 + Math.sin(angle) * radiusY * ring + jitterY, 16, 86),
          color
        };
      });
    }

    function renderKnowledgeGraph(node) {
      const children = childNodes(node);
      if (!children.length) return "";
      const points = graphPoints(children, node).map((point) => ({
        ...point,
        coverage: coverageStats(point.rows)
      }));
      const centerCoverage = coverageStats(node.rows);
      const centerType = node.type === "root" ? "Root" : node.type === "function" ? "Function" : node.type === "category" ? "Category" : "Sub Category";
      const centerLabel = node.id === "root" ? "GSC" : node.label || "Not provided";
      const childLabel = node.type === "root" ? "Function" : node.type === "function" ? "Category" : "Sub Category";
      const title = node.type === "root" ? "Knowledge graph vector space" : `${centerLabel} knowledge graph`;
      const subtitle = `${centerType} / ${node.rows.length} records / ${children.length} ${childLabel} nodes`;
      return `
        <section class="knowledge-graph">
          <div class="kg-head">
            <h3>${escapeHtml(title)}</h3>
            <p>${escapeHtml(subtitle)}</p>
          </div>
          <div class="kg-stage" data-kg-stage>
            <div class="kg-grid" aria-hidden="true"></div>
            <canvas class="kg-canvas" aria-hidden="true"></canvas>
            <button class="kg-node core ${centerCoverage.hasCoverage ? "is-covered" : ""}" type="button" data-action="select" data-node-id="${escapeHtml(node.id)}"
              data-x="50" data-y="53" data-color="#FFD36A" data-count="${node.rows.length}" data-covered="${centerCoverage.covered}" data-ratio="${centerCoverage.ratio.toFixed(3)}" data-label="${escapeHtml(centerLabel)}"
              style="--x: 50%; --y: 53%; --node-color: #FFD36A; --coverage-ratio: ${centerCoverage.ratio.toFixed(3)}">
              <span class="kg-node-dot" aria-hidden="true"></span>
              <span><strong>${escapeHtml(centerLabel)}</strong><span>${escapeHtml(centerType)} · ${node.rows.length} records</span>${centerCoverage.hasCoverage ? `<em class="coverage-badge">${coverageLabel(centerCoverage)}</em>` : ""}</span>
            </button>
            ${points.map((point) => `
              <button class="kg-node ${graphNodeClass(point.type)} ${point.coverage.hasCoverage ? "is-covered" : ""} ${point.coverage.fullCoverage ? "is-full-covered" : ""}" type="button" data-action="select-expand" data-node-id="${escapeHtml(point.id)}"
                data-x="${point.x.toFixed(2)}" data-y="${point.y.toFixed(2)}" data-color="${point.color}" data-count="${point.rows.length}" data-covered="${point.coverage.covered}" data-ratio="${point.coverage.ratio.toFixed(3)}" data-label="${escapeHtml(point.label || "Not provided")}"
                style="--x: ${point.x.toFixed(2)}%; --y: ${point.y.toFixed(2)}%; --node-color: ${point.color}; --coverage-ratio: ${point.coverage.ratio.toFixed(3)}">
                <span class="kg-node-dot" aria-hidden="true"></span>
                <span><strong>${escapeHtml(point.label || "Not provided")}</strong><span>${escapeHtml(point.type)} · ${point.rows.length} records</span>${point.coverage.hasCoverage ? `<em class="coverage-badge">${coverageLabel(point.coverage)}</em>` : ""}</span>
              </button>
            `).join("")}
            <div class="kg-legend" aria-hidden="true">
              <span>GSC core</span>
              <span>${children.length} visible nodes</span>
              <span>${node.rows.length} source records</span>
              <span>${centerCoverage.covered} covered records</span>
            </div>
          </div>
        </section>
      `;
    }

    function renderSummary(node) {
      const nodeRows = node.rows || [];
      const coverage = coverageStats(nodeRows);
      return `
        <div class="summary-grid">
          <div class="summary-tile"><strong>${nodeRows.length}</strong><span>Records</span></div>
          <div class="summary-tile"><strong>${uniqueCount(nodeRows, (row) => row.category)}</strong><span>Categories</span></div>
          <div class="summary-tile"><strong>${uniqueCount(nodeRows, (row) => row.subCategory)}</strong><span>Sub Categories</span></div>
          <div class="summary-tile"><strong>${uniqueCount(nodeRows, (row) => row.kmFocal)}</strong><span>KM Focal</span></div>
          <div class="summary-tile coverage"><strong>${coverage.covered}</strong><span>Covered Sub Categories / ${coverage.total}</span></div>
        </div>
      `;
    }

    function renderCards(node) {
      if (!node.rows.length) {
        return `<div class="empty">No taxonomy records match the current filter.</div>`;
      }

      if (node.type === "root" || node.type === "function" || node.type === "category") {
        const children = childNodes(node);
        return `
          <h3 class="section-title">Information Cards</h3>
          <div class="cards">
            ${children.slice(0, 80).map((child) => renderOverviewCard(child, node)).join("")}
          </div>
          ${children.length > 80 ? `<p class="footer-note">This level has ${children.length} nodes. The first 80 information cards are shown. Use the tree to inspect the full detail.</p>` : ""}
        `;
      }

      return `
        <h3 class="section-title">Information Cards</h3>
        <div class="cards">
          ${node.rows.map(renderRecordCard).join("")}
        </div>
      `;
    }

    function renderOverviewCard(child) {
      const first = child.rows[0] || {};
      const coverage = coverageStats(child.rows);
      const focal = Array.from(new Set(child.rows.map((row) => row.kmFocal).filter(Boolean))).slice(0, 6).join(", ");
      const km = Array.from(new Set(child.rows.map((row) => row.km).filter(Boolean))).slice(0, 4).join(", ");
      return `
        <article class="detail-card ${coverage.hasCoverage ? "is-covered" : ""}">
          <h3>${escapeHtml(child.label || "Not provided")}</h3>
          <div class="meta">
            <span class="pill">${escapeHtml(child.type)}</span>
            <span class="pill">${child.rows.length} records</span>
            ${coverage.hasCoverage ? `<span class="pill covered">${coverageLabel(coverage)}</span>` : ""}
            ${first.sheet ? `<span class="pill">Sheet: ${escapeHtml(first.sheet)}</span>` : ""}
          </div>
          <div class="fields">
            <div class="field muted"><label>KM</label><div>${escapeHtml(displayValue(km))}</div></div>
            <div class="field muted"><label>KM Focal</label><div>${escapeHtml(displayValue(focal))}</div></div>
          </div>
        </article>
      `;
    }

    function renderRecordCard(row) {
      const covered = isCovered(row);
      const meta = [
        row.sheet ? `Sheet: ${row.sheet}` : "",
        row.no ? `No. ${row.no}` : "",
        row.excelRow ? `Excel Row ${row.excelRow}` : ""
      ].filter(Boolean);
      return `
        <article class="detail-card ${covered ? "is-covered" : ""}">
          <h3>${escapeHtml(displayValue(row.subCategory))}</h3>
          <div class="meta">
            ${covered ? `<span class="pill covered">Covered</span>` : `<span class="pill">Not covered</span>`}
            ${meta.map((item) => `<span class="pill">${escapeHtml(item)}</span>`).join("")}
          </div>
          <div class="fields">
            ${fieldLabels.map(([key, label]) => `
              <div class="field ${key === "description" ? "" : "muted"}">
                <label>${escapeHtml(label)}</label>
                <div>${escapeHtml(displayValue(row[key]))}</div>
              </div>
            `).join("")}
          </div>
        </article>
      `;
    }

    function renderContent() {
      const node = getNode(state.selectedId);
      const title = node.id === "root" ? "GSC" : node.label || "Not provided";
      const typeLabel = node.type === "root" ? "Root" : node.type === "function" ? "Function" : node.type === "category" ? "Category" : "Sub Category";
      const subtitle = state.query
        ? `The current search matches ${filterRows().length} records. The graph and cards update with the filter.`
        : "Click any graph node or tree node to expand the next level and view information cards.";

      document.getElementById("content").innerHTML = `
        <div class="hero-strip">
          <div>
            <div class="eyebrow">${escapeHtml(typeLabel)}</div>
            <h2>${escapeHtml(title)}</h2>
            <p>${escapeHtml(subtitle)}</p>
          </div>
          <div class="path">${breadcrumbs(node)}</div>
        </div>
        ${renderSummary(node)}
        ${renderKnowledgeGraph(node)}
        ${renderCards(node)}
        <p class="footer-note">Hierarchy and card fields are sourced from Excel: Function, Category, Sub_Category, Description, KM, Biz Owner, KM Focal, Status, and Comments.</p>
      `;
      requestAnimationFrame(drawKnowledgeGraphs);
    }

    function hexToRgb(hex) {
      const clean = String(hex || "#7EE7FF").replace("#", "");
      const normalized = clean.length === 3 ? clean.split("").map((char) => char + char).join("") : clean;
      return [
        parseInt(normalized.slice(0, 2), 16) || 126,
        parseInt(normalized.slice(2, 4), 16) || 231,
        parseInt(normalized.slice(4, 6), 16) || 255
      ];
    }

    function seededUnit(seed, index) {
      const raw = Math.sin(seed * 12.9898 + index * 78.233) * 43758.5453;
      return raw - Math.floor(raw);
    }

    function drawKnowledgeGraphs() {
      for (const stage of document.querySelectorAll("[data-kg-stage]")) {
        const canvas = stage.querySelector(".kg-canvas");
        if (!canvas) continue;
        const rect = stage.getBoundingClientRect();
        if (!rect.width || !rect.height) continue;
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(rect.width * ratio);
        canvas.height = Math.floor(rect.height * ratio);
        const context = canvas.getContext("2d");
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.clearRect(0, 0, rect.width, rect.height);

        const centerNode = stage.querySelector(".kg-node.core");
        const nodes = Array.from(stage.querySelectorAll(".kg-node:not(.core)"));
        const center = {
          x: (Number(centerNode?.dataset.x) || 50) / 100 * rect.width,
          y: (Number(centerNode?.dataset.y) || 53) / 100 * rect.height
        };

        context.save();
        context.lineWidth = 1;
        context.strokeStyle = "rgba(126, 231, 255, 0.12)";
        context.beginPath();
        context.moveTo(center.x, center.y);
        context.lineTo(center.x + rect.width * 0.18, center.y - rect.height * 0.3);
        context.moveTo(center.x, center.y);
        context.lineTo(center.x - rect.width * 0.12, center.y - rect.height * 0.23);
        context.moveTo(center.x, center.y);
        context.lineTo(center.x + rect.width * 0.29, center.y + rect.height * 0.16);
        context.stroke();
        context.restore();

        for (let index = 0; index < 240; index += 1) {
          const seed = 7127 + index * 97;
          const x = seededUnit(seed, 1) * rect.width;
          const y = seededUnit(seed, 2) * rect.height;
          const alpha = 0.16 + seededUnit(seed, 3) * 0.34;
          const radius = 0.45 + seededUnit(seed, 4) * 1.05;
          const tint = index % 4 === 0 ? "126,231,255" : index % 4 === 1 ? "255,72,217" : index % 4 === 2 ? "255,211,106" : "255,255,255";
          context.beginPath();
          context.fillStyle = `rgba(${tint}, ${alpha})`;
          context.arc(x, y, radius, 0, Math.PI * 2);
          context.fill();
        }

        nodes.forEach((node, nodeIndex) => {
          const x = (Number(node.dataset.x) || 50) / 100 * rect.width;
          const y = (Number(node.dataset.y) || 50) / 100 * rect.height;
          const color = node.dataset.color || "#7EE7FF";
          const [r, g, b] = hexToRgb(color);
          const covered = Number(node.dataset.covered || 0);
          const ratio = Number(node.dataset.ratio || 0);
          const count = Math.min(84, Math.max(18, Number(node.dataset.count || 1) * 1.4 + covered * 1.8));
          const seed = hashString(`${node.dataset.label}-${nodeIndex}`);

          const gradient = context.createLinearGradient(center.x, center.y, x, y);
          gradient.addColorStop(0, `rgba(255, 211, 106, ${0.2 + ratio * 0.32})`);
          gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, ${0.48 + ratio * 0.28})`);
          context.beginPath();
          context.strokeStyle = gradient;
          context.lineWidth = (node.classList.contains("function") ? 1.25 : 0.9) + ratio * 1.2;
          context.moveTo(center.x, center.y);
          const midX = (center.x + x) / 2 + Math.sin(seed) * 18;
          const midY = (center.y + y) / 2 + Math.cos(seed) * 18;
          context.quadraticCurveTo(midX, midY, x, y);
          context.stroke();

          if (covered > 0) {
            const halo = context.createRadialGradient(x, y, 4, x, y, 96 + ratio * 54);
            halo.addColorStop(0, `rgba(255, 211, 106, ${0.32 + ratio * 0.22})`);
            halo.addColorStop(0.42, `rgba(255, 211, 106, ${0.12 + ratio * 0.12})`);
            halo.addColorStop(1, "rgba(255, 211, 106, 0)");
            context.beginPath();
            context.fillStyle = halo;
            context.arc(x, y, 96 + ratio * 54, 0, Math.PI * 2);
            context.fill();
          }

          for (let pointIndex = 0; pointIndex < count; pointIndex += 1) {
            const angle = seededUnit(seed, pointIndex * 3 + 1) * Math.PI * 2;
            const distance = Math.sqrt(seededUnit(seed, pointIndex * 3 + 2)) * ((node.classList.contains("function") ? 82 : 58) + ratio * 26);
            const px = clamp(x + Math.cos(angle) * distance, 3, rect.width - 3);
            const py = clamp(y + Math.sin(angle) * distance, 3, rect.height - 3);
            const alpha = 0.32 + seededUnit(seed, pointIndex * 3 + 3) * 0.58;
            const radius = 0.8 + seededUnit(seed, pointIndex * 3 + 4) * 1.8;
            const useGold = covered > 0 && pointIndex % 3 === 0;
            context.beginPath();
            context.fillStyle = useGold ? `rgba(255, 211, 106, ${Math.min(0.96, alpha + 0.16)})` : `rgba(${r}, ${g}, ${b}, ${alpha})`;
            context.shadowBlur = 8;
            context.shadowColor = useGold ? "rgba(255, 211, 106, 0.78)" : `rgba(${r}, ${g}, ${b}, 0.7)`;
            context.arc(px, py, radius, 0, Math.PI * 2);
            context.fill();
          }
          context.shadowBlur = 0;
        });
      }
    }

    function renderMetrics() {
      document.getElementById("metricRows").textContent = payload.totalRows;
      document.getElementById("metricFunctions").textContent = payload.functionCount;
      document.getElementById("metricCategories").textContent = payload.categoryCount;
      document.getElementById("metricSubCategories").textContent = payload.subCategoryCount;
      document.getElementById("metricCovered").textContent = payload.coveredSubCategoryCount || 0;
    }

    function render() {
      renderTree();
      if (!state.nodes.has(state.selectedId)) {
        state.selectedId = "root";
        renderTree();
      }
      renderContent();
    }

    function expandAncestors(node) {
      if (!node) return;
      state.expanded.add("root");
      if (node.parts && node.parts[0]) state.expanded.add(nodeId("function", [node.parts[0]]));
      if (node.parts && node.parts[1]) state.expanded.add(nodeId("category", [node.parts[0], node.parts[1]]));
    }

    function collectExpandableIds() {
      const ids = ["root"];
      for (const functionGroup of groupByOrdered(filterRows(), (row) => row.function)) {
        ids.push(nodeId("function", [functionGroup.label]));
        for (const categoryGroup of groupByOrdered(functionGroup.rows, (row) => row.category)) {
          ids.push(nodeId("category", [functionGroup.label, categoryGroup.label]));
        }
      }
      return ids;
    }

    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      const id = button.dataset.nodeId;
      if (!id) return;

      if (action === "toggle-select") {
        if (state.expanded.has(id)) state.expanded.delete(id);
        else state.expanded.add(id);
        state.selectedId = id;
      } else if (action === "select-expand") {
        state.selectedId = id;
        expandAncestors(getNode(id));
        state.expanded.add(id);
      } else if (action === "select") {
        state.selectedId = id;
        expandAncestors(getNode(id));
      }
      render();
    });

    document.getElementById("searchInput").addEventListener("input", (event) => {
      state.query = event.target.value;
      state.selectedId = "root";
      if (state.query.trim()) {
        state.expanded = new Set(collectExpandableIds());
      }
      render();
    });

    document.getElementById("expandAll").addEventListener("click", () => {
      state.expanded = new Set(collectExpandableIds());
      render();
    });

    document.getElementById("collapseAll").addEventListener("click", () => {
      state.expanded = new Set(["root"]);
      state.selectedId = "root";
      render();
    });

    document.getElementById("resetView").addEventListener("click", () => {
      state.query = "";
      document.getElementById("searchInput").value = "";
      state.selectedId = "root";
      state.expanded = new Set(["root"]);
      render();
    });

    function startStarfield() {
      const canvas = document.getElementById("starfield");
      const context = canvas.getContext("2d");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let width = 0;
      let height = 0;
      let stars = [];

      function resize() {
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * ratio);
        canvas.height = Math.floor(height * ratio);
        canvas.style.width = `${width}px`;
        canvas.style.height = `${height}px`;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        const count = Math.min(260, Math.max(120, Math.floor((width * height) / 7800)));
        stars = Array.from({ length: count }, (_, index) => ({
          x: (index * 131.7) % width,
          y: (index * 89.3) % height,
          r: 0.6 + ((index * 17) % 11) / 10,
          s: 0.08 + ((index * 7) % 9) / 100,
          hue: index % 5
        }));
      }

      function draw() {
        context.clearRect(0, 0, width, height);
        for (const star of stars) {
          star.y += reduceMotion ? 0 : star.s;
          if (star.y > height + 4) star.y = -4;
          const color = star.hue === 0 ? "126,231,255" : star.hue === 1 ? "255,211,106" : star.hue === 2 ? "189,167,255" : "255,255,255";
          context.beginPath();
          context.fillStyle = `rgba(${color}, ${0.52 + star.r / 3})`;
          context.shadowBlur = 9;
          context.shadowColor = `rgba(${color}, 0.7)`;
          context.arc(star.x, star.y, star.r, 0, Math.PI * 2);
          context.fill();
        }

        context.shadowBlur = 0;
        context.strokeStyle = "rgba(126, 231, 255, 0.07)";
        context.lineWidth = 1;
        for (let i = 0; i < stars.length; i += 7) {
          const a = stars[i];
          const b = stars[(i + 17) % stars.length];
          const dx = a.x - b.x;
          const dy = a.y - b.y;
          if (dx * dx + dy * dy < 26000) {
            context.beginPath();
            context.moveTo(a.x, a.y);
            context.lineTo(b.x, b.y);
            context.stroke();
          }
        }

        if (!reduceMotion) requestAnimationFrame(draw);
      }

      resize();
      window.addEventListener("resize", resize);
      draw();
    }

    renderMetrics();
    render();
    startStarfield();
    window.addEventListener("resize", () => requestAnimationFrame(drawKnowledgeGraphs));
  </script>
</body>
</html>
